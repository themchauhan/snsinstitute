why:
  - titleEn: Specialised teacher for every subject
    titleHi: हर विषय के लिए विशेषज्ञ शिक्षक
    textEn: Physics, Chemistry, Biology, Maths and English are taught by separate subject experts.
    textHi: भौतिकी, रसायन, जीव विज्ञान, गणित और अंग्रेज़ी – हर विषय के अलग विशेषज्ञ शिक्षक।
  - titleEn: Small batches, personal attention
    titleHi: छोटे बैच, व्यक्तिगत ध्यान
    textEn: Every student is known by name. Doubts are cleared in class, not left for later.
    textHi: हर छात्र पर ध्यान। डाउट्स क्लास में ही हल किए जाते हैं।
  - titleEn: Regular tests & doubt sessions
    titleHi: नियमित टेस्ट और डाउट सेशन
    textEn: Chapter tests and full-length mock tests in the real exam pattern, with result analysis.
    textHi: असली परीक्षा पैटर्न पर चैप्टर टेस्ट और मॉक टेस्ट, विश्लेषण के साथ।
  - titleEn: Hindi + English explanation
    titleHi: हिंदी + अंग्रेज़ी में समझाना
    textEn: Concepts are explained in the language the student understands best.
    textHi: छात्र जिस भाषा में बेहतर समझे, उसी में समझाया जाता है।
  - titleEn: Hostel facility available
    titleHi: हॉस्टल सुविधा उपलब्ध
    textEn: Students from other cities can stay close to the institute and focus fully on preparation.
    textHi: दूसरे शहरों के छात्र इंस्टीट्यूट के पास रहकर पूरी तरह तैयारी पर ध्यान दे सकते हैं।
