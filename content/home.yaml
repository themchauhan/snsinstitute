announcementEn: Admissions open for 2027 batches – JEE, NEET, Foundation & Class 5–12.
announcementHi: 2027 बैच के लिए एडमिशन शुरू – JEE, NEET, फाउंडेशन और कक्षा 5–12।
heroTitleEn: Rewari's trusted coaching for JEE, NEET & Class 5–12
heroTitleHi: तैयारी करें जीत की – रेवाड़ी में JEE, NEET और कक्षा 5–12 की कोचिंग
heroTextEn: Specialised teachers for every subject, small batches and regular tests – right here on Narnaul Road, Rewari. Book a free demo class today.
heroTextHi: हर विषय के लिए विशेषज्ञ शिक्षक, छोटे बैच और नियमित टेस्ट – नारनौल रोड, रेवाड़ी में। आज ही फ्री डेमो क्लास बुक करें।
heroImage: /images/home/award-ceremony.jpg
