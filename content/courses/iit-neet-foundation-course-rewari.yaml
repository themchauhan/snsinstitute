bodyEn: |
  ## Foundation course for class 6–10 in Rewari

  Students who start early have a big advantage in JEE and NEET. Our foundation course builds **concept clarity in Maths and Science** from class 6 onwards, while making sure school marks also improve.

  - Concept-based learning instead of rote memorisation
  - Reasoning and mental ability practice
  - Preparation for NTSE, Olympiads and scholarship exams
  - Regular tests and parent updates
seo:
  title: IIT & NEET Foundation Course for Class 6–10 in Rewari | SNS
  description: Build a strong base for JEE, NEET and Olympiads from class 6 to 10, along with school exam preparation. Foundation batches in Rewari.
whoFor:
  - en: Class 6 to 10 students who want a strong base early
    hi: जल्दी मज़बूत नींव चाहने वाले कक्षा 6 से 10 के छात्र
  - en: Students planning for JEE or NEET in the future
    hi: भविष्य में JEE या NEET की योजना बनाने वाले छात्र
  - en: Students preparing for NTSE and Olympiads
    hi: NTSE और ओलंपियाड की तैयारी करने वाले छात्र
syllabus:
  - subject: Mathematics
    topicsEn: |-
      Number System
      Algebra
      Linear Equations
      Geometry
      Mensuration
      Trigonometry (basics)
      Statistics & Probability
  - subject: Science
    topicsEn: |-
      Motion & Force
      Work & Energy
      Light & Sound
      Electricity & Magnetism
      Atoms & Molecules
      Chemical Reactions
      Cell & Tissues
      Life Processes
  - subject: Mental Ability
