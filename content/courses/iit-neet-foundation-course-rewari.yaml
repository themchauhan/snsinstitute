features:
  - titleEn: Printed study material
    titleHi: प्रिंटेड स्टडी मटेरियल
    textEn: Chapter-wise notes, formula sheets and practice questions prepared by our teachers.
    textHi: शिक्षकों द्वारा तैयार चैप्टर-वार नोट्स, फॉर्मूला शीट और प्रैक्टिस प्रश्न।
  - titleEn: Weekly tests
    titleHi: साप्ताहिक टेस्ट
    textEn: Tests in the real exam pattern every week, followed by discussion of every mistake.
    textHi: हर हफ्ते असली परीक्षा पैटर्न पर टेस्ट, फिर हर गलती पर चर्चा।
  - titleEn: Daily doubt sessions
    titleHi: रोज़ डाउट सेशन
    textEn: Ask any doubt after class – teachers are available every day.
    textHi: क्लास के बाद कोई भी डाउट पूछें – शिक्षक रोज़ उपलब्ध।
  - titleEn: Progress reports for parents
    titleHi: अभिभावकों के लिए प्रगति रिपोर्ट
    textEn: Parents stay updated on test scores, attendance and areas to improve.
    textHi: टेस्ट स्कोर, उपस्थिति और सुधार के बिंदुओं की जानकारी।
  - titleEn: Small batches
    titleHi: छोटे बैच
    textEn: Limited students per batch so every student gets attention.
    textHi: हर बैच में सीमित छात्र, ताकि सब पर ध्यान दिया जा सके।
roadmap:
  - titleEn: Strengthen basics
    titleHi: बेसिक मज़बूत करें
    textEn: School syllabus explained with concepts, not rote learning.
    textHi: रटने के बजाय कॉन्सेप्ट के साथ स्कूल सिलेबस।
  - titleEn: Apply concepts
    titleHi: कॉन्सेप्ट लागू करें
    textEn: Higher-order questions that build thinking skills.
    textHi: सोचने की क्षमता बढ़ाने वाले उच्च स्तर के प्रश्न।
  - titleEn: Olympiad & NTSE practice
    titleHi: ओलंपियाड और NTSE अभ्यास
    textEn: Practice papers for competitive exams.
    textHi: प्रतियोगी परीक्षाओं के प्रैक्टिस पेपर।
  - titleEn: Test & improve
    titleHi: टेस्ट और सुधार
    textEn: Regular tests and feedback for steady improvement.
    textHi: लगातार सुधार के लिए नियमित टेस्ट और फीडबैक।
