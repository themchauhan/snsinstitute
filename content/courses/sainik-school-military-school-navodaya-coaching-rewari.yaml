  "fee": "Call for fee details",
  "bodyEn": "## Sainik School, Military School & Navodaya coaching in Rewari\n\nGetting into a **Sainik School**, **Rashtriya Military School (RMS)** or **Jawahar Navodaya Vidyalaya (JNV)** gives children quality education, discipline and – in Sainik Schools and RMS – a strong foundation for a career in the armed forces through NDA. Haryana has Sainik Schools at Kunjpura and Rewari, and Rewari district has its own Jawahar Navodaya Vidyalaya.\n\nAt SNS Institute, one focused batch prepares students for all three entrance exams.\n\n### Exam pattern at a glance (Class 6 entry)\n\n| Exam | Conducted by | Subjects | Questions / Marks |\n| --- | --- | --- | --- |\n| Sainik School (AISSEE) | NTA | Maths, Intelligence, Language, GK | 125 questions, 300 marks, 150 min |\n| Rashtriya Military School (RMS CET) | RMS Society | English, Intelligence, Maths, GK & Current Affairs | 200 marks |\n| Navodaya (JNVST) | NVS | Mental Ability, Arithmetic, Language | 80 questions, 100 marks, 2 hours |\n\nFor **Class 9** entry, AISSEE has 150 questions (400 marks) from Maths, Intelligence, English, General Science and Social Studies.\n\n*Patterns are based on recent years. Always check the official notification (exams.nta.nic.in/sainik-school-society, rashtriyamilitaryschools.edu.in, navodaya.gov.in) for the latest details.*\n",
  "bodyHi": "## रेवाड़ी में सैनिक स्कूल, मिलिट्री स्कूल और नवोदय कोचिंग\n\n**सैनिक स्कूल**, **राष्ट्रीय मिलिट्री स्कूल (RMS)** या **जवाहर नवोदय विद्यालय (JNV)** में प्रवेश से बच्चे को गुणवत्तापूर्ण शिक्षा, अनुशासन और – सैनिक स्कूल व RMS में – NDA के ज़रिए सेना में करियर की मज़बूत नींव मिलती है।\n\nSNS इंस्टीट्यूट में एक ही फोकस्ड बैच तीनों प्रवेश परीक्षाओं की तैयारी करवाता है।\n\n### परीक्षा पैटर्न (कक्षा 6 प्रवेश)\n\n| परीक्षा | आयोजक | विषय | प्रश्न / अंक |\n| --- | --- | --- | --- |\n| सैनिक स्कूल (AISSEE) | NTA | गणित, बुद्धिमत्ता, भाषा, सामान्य ज्ञान | 125 प्रश्न, 300 अंक, 150 मिनट |\n| राष्ट्रीय मिलिट्री स्कूल (RMS CET) | RMS सोसाइटी | अंग्रेज़ी, बुद्धिमत्ता, गणित, सामान्य ज्ञान | 200 अंक |\n| नवोदय (JNVST) | NVS | मानसिक योग्यता, अंकगणित, भाषा | 80 प्रश्न, 100 अंक, 2 घंटे |\n\n*पैटर्न हाल के वर्षों पर आधारित है। नवीनतम जानकारी के लिए आधिकारिक अधिसूचना ज़रूर देखें।*\n",
