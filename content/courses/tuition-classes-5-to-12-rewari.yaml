bodyEn: |
  ## Tuition classes in Rewari for class 5 to 12

  We teach students of **CBSE and HBSE (Haryana Board)** schools in Rewari. Each subject is taught by a specialised teacher, and the focus is on understanding plus scoring well in school and board exams.

  - Class 5–8: Maths, Science, English
  - Class 9–10: Maths, Science, English with board exam preparation
  - Class 11–12: Physics, Chemistry, Maths, Biology (Science stream)
  - Regular tests, previous year papers and sample papers
bodyHi: |
  ## रेवाड़ी में कक्षा 5 से 12 की ट्यूशन

  हम रेवाड़ी के **CBSE और HBSE (हरियाणा बोर्ड)** स्कूलों के छात्रों को पढ़ाते हैं। हर विषय के लिए विशेषज्ञ शिक्षक हैं।

  - कक्षा 5–8: गणित, विज्ञान, अंग्रेज़ी
  - कक्षा 9–10: गणित, विज्ञान, अंग्रेज़ी – बोर्ड तैयारी सहित
  - कक्षा 11–12: भौतिकी, रसायन, गणित, जीव विज्ञान
  - नियमित टेस्ट, पिछले वर्ष के पेपर और सैंपल पेपर
