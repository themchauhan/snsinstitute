  "bodyEn": "## JEE coaching in Rewari\n\nOur IIT-JEE programme prepares students of class 11, class 12 and droppers for **JEE Main** and **JEE Advanced**. Classes are taken by separate experts for Physics, Chemistry and Mathematics.\n\n### What the programme includes\n\n- Complete JEE syllabus, taught from basics to advanced level\n- Printed study material and practice sheets\n- Weekly chapter tests and full-length mock tests in the JEE pattern\n- Test analysis and one-to-one feedback\n- Preparation for CBSE / HBSE board exams along with JEE\n\n",
