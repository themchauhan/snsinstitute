bodyEn: |+
  ## NEET coaching in Rewari

  Our NEET programme is built around **NCERT**, because most NEET-UG questions come directly from it. Biology, Physics and Chemistry are taught by separate subject experts.

  ### What the programme includes

  - Complete NEET-UG syllabus with NCERT focus
  - Weekly tests on OMR sheets in the real NEET pattern
  - Full-length mock tests before the exam
  - Special repeater (dropper) batch
  - Board exam preparation alongside NEET

bodyHi: |
  ## रेवाड़ी में NEET कोचिंग

  हमारा NEET प्रोग्राम **NCERT** पर आधारित है, क्योंकि NEET-UG के ज़्यादातर प्रश्न सीधे NCERT से आते हैं। जीव विज्ञान, भौतिकी और रसायन के अलग विशेषज्ञ शिक्षक हैं।

  ### प्रोग्राम में क्या मिलता है

  - NCERT पर फोकस के साथ पूरा NEET-UG सिलेबस
  - असली NEET पैटर्न पर OMR शीट से साप्ताहिक टेस्ट
  - परीक्षा से पहले फुल-लेंथ मॉक टेस्ट
  - रिपीटर (ड्रॉपर) बैच
  - साथ में बोर्ड परीक्षा की तैयारी
