  "introEn": "SNS Institute has been helping students of Rewari and nearby towns prepare for JEE, NEET and school board exams since 2018.",
  "introHi": "SNS इंस्टीट्यूट 2018 से रेवाड़ी और आसपास के छात्रों को JEE, NEET और बोर्ड परीक्षाओं की तैयारी करवा रहा है।",
  "bodyEn": "## Our story\n\nSNS Institute started in Rewari in 2018 with one goal: give students of South Haryana the same quality of coaching that is usually only found in big cities – without leaving home.\n\nToday we teach **IIT-JEE**, **NEET**, **IIT/NEET foundation** and **school tuition for classes 5 to 12** (CBSE and HBSE) at Gopal Dev Chowk, Narnaul Road.\n\n## How we teach\n\n- A specialised teacher for every subject\n- Small batches so every student gets attention\n- Regular tests in the real exam pattern\n- Doubt sessions and personal mentoring\n- Concepts explained in Hindi and English\n\n",
  "bodyHi": "## हमारी कहानी\n\nSNS इंस्टीट्यूट की शुरुआत 2018 में रेवाड़ी में हुई। हमारा लक्ष्य है – दक्षिण हरियाणा के छात्रों को बड़े शहरों जैसी गुणवत्ता वाली कोचिंग, अपने ही शहर में।\n\nआज हम गोपाल देव चौक, नारनौल रोड पर **IIT-JEE**, **NEET**, **IIT/NEET फाउंडेशन** और **कक्षा 5 से 12 (CBSE और HBSE)** की ट्यूशन पढ़ाते हैं।\n\n## हम कैसे पढ़ाते हैं\n\n- हर विषय के लिए विशेषज्ञ शिक्षक\n- छोटे बैच, हर छात्र पर ध्यान\n- असली परीक्षा पैटर्न पर नियमित टेस्ट\n- डाउट सेशन और व्यक्तिगत मार्गदर्शन\n- हिंदी और अंग्रेज़ी दोनों में समझाना\n\n",
