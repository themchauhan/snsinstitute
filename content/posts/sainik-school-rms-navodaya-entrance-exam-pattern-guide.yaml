  "excerptEn": "AISSEE, RMS CET and JNVST compared – who can apply, subjects, marks and how parents in Rewari can prepare their child for Class 6 admission.",
  "excerptHi": "AISSEE, RMS CET और JNVST की तुलना – कौन आवेदन कर सकता है, विषय, अंक और कक्षा 6 प्रवेश की तैयारी कैसे करें।",
  "bodyEn": "Many parents in Rewari and nearby districts want their child to study in a **Sainik School**, a **Rashtriya Military School (RMS)** or a **Jawahar Navodaya Vidyalaya (JNV)**. All three admit students in Class 6 (and some in Class 9) through an entrance exam.\n\n## 1. Sainik School – AISSEE\n\n- Conducted by the **National Testing Agency (NTA)**\n- **Class 6:** 125 questions, 300 marks, 150 minutes – Mathematics (50 questions × 3 marks), Intelligence, Language and General Knowledge (25 questions × 2 marks each)\n- **Class 9:** 150 questions, 400 marks – Maths, Intelligence, English, General Science and Social Studies\n- No negative marking; the exam can be written in Hindi or English\n\n## 2. Rashtriya Military School – RMS CET\n\n- Schools at Ajmer, Belagavi, Bengaluru, Chail and Dholpur\n- **Class 6:** English, Intelligence, Mathematics and GK & Current Affairs – 50 marks each (200 marks)\n- Based on the Class 5 CBSE syllabus; bilingual paper\n\n## 3. Navodaya – JNVST\n\n- Conducted by **Navodaya Vidyalaya Samiti (NVS)** for the JNV in your own district\n- **Class 6:** 80 questions, 100 marks, 2 hours – Mental Ability (40 questions), Arithmetic (20) and Language (20)\n- Students must be studying in Class 5 in the same district\n\n## How to prepare\n\n1. Start in **Class 4 or early Class 5**\n2. Practise **mental ability** daily – it carries the most weight in JNVST\n3. Build **Maths speed** – it carries half the marks in AISSEE Class 6\n4. Read GK and current affairs every week\n5. Solve **previous year papers** on OMR sheets\n\n*Exam patterns are based on recent years. Always check the official notification for the latest details.*\n\nSNS Institute, Rewari runs a dedicated batch for all three exams. Book a free demo class to know more.\n",
