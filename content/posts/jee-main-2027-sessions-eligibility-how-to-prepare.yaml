  "excerptEn": "JEE Main is held in two sessions. Here is what students of Rewari and nearby towns should know and how to plan their preparation.",
  "excerptHi": "JEE Main दो सेशन में होता है। रेवाड़ी और आसपास के छात्रों के लिए ज़रूरी जानकारी।",
  "bodyEn": "JEE Main is conducted by the **National Testing Agency (NTA)**, usually in **two sessions** (January and April). Official dates for 2027 will be announced on **jeemain.nta.nic.in**.\n\n## Why two sessions help\n\nStudents can appear in both sessions and the **better score** is considered. Use session 1 as a real-exam experience and improve in session 2.\n\n## How to prepare\n\n- Finish NCERT for Physics, Chemistry and Maths first\n- Solve previous year JEE Main questions chapter-wise\n- Give at least one full-length mock test every week from November\n- Keep board exam preparation going – it matters for admissions\n\n## JEE Advanced\n\nTop scorers in JEE Main qualify for **JEE Advanced**, the exam for IIT admission.\n\nSNS Institute runs JEE batches for class 11, 12 and droppers on Narnaul Road, Rewari.\n",
