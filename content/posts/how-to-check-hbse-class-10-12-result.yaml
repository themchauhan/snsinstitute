  "titleEn": "How to Check HBSE Class 10 and 12 Result (Haryana Board)",
  "titleHi": "HBSE कक्षा 10 और 12 का रिज़ल्ट कैसे देखें (हरियाणा बोर्ड)",
  "excerptEn": "Step-by-step guide to checking your Haryana Board (BSEH) class 10 and class 12 result online.",
  "excerptHi": "हरियाणा बोर्ड (BSEH) कक्षा 10 और 12 का रिज़ल्ट ऑनलाइन देखने का आसान तरीका।",
  "bodyEn": "The Board of School Education Haryana (BSEH) publishes class 10 and 12 results on its official website **bseh.org.in**.\n\n## Steps to check your result\n\n1. Open **bseh.org.in**\n2. Click on the **Results** section\n3. Select class 10 or class 12 (Secondary / Senior Secondary)\n4. Enter your **roll number** and date of birth if asked\n5. Download and save the marksheet\n\nKeep your admit card ready before the result is announced. The original marksheet is given by your school later.\n",
  "bodyHi": "हरियाणा विद्यालय शिक्षा बोर्ड (BSEH) कक्षा 10 और 12 का रिज़ल्ट अपनी आधिकारिक वेबसाइट **bseh.org.in** पर जारी करता है।\n\n## रिज़ल्ट देखने के स्टेप\n\n1. **bseh.org.in** खोलें\n2. **Results** सेक्शन पर क्लिक करें\n3. कक्षा 10 या 12 चुनें\n4. अपना **रोल नंबर** और जन्म तिथि डालें\n5. मार्कशीट डाउनलोड करके सेव करें\n\nरिज़ल्ट आने से पहले अपना एडमिट कार्ड तैयार रखें।\n",
