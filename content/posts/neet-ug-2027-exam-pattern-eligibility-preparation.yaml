  "excerptEn": "Everything a class 12 or repeater student in Haryana needs to know about NEET UG 2027 – pattern, eligibility and how to plan the next few months.",
  "excerptHi": "NEET UG 2027 के बारे में हरियाणा के छात्रों के लिए ज़रूरी जानकारी – पैटर्न, योग्यता और तैयारी योजना।",
  "bodyEn": "NEET UG is conducted by the **National Testing Agency (NTA)**. The official dates, information bulletin and registration for NEET UG 2027 will be published on **neet.nta.nic.in** – always check the official website before relying on any date.\n\n## Who can appear\n\n- Students who have passed or are appearing in class 12 with Physics, Chemistry, Biology and English\n- Minimum age requirement as per the NTA bulletin\n\n## Exam pattern (as per recent years)\n\n| Subject | Focus |\n| --- | --- |\n| Biology (Botany + Zoology) | Half of the paper – NCERT is the key |\n| Physics | Numericals and concepts |\n| Chemistry | NCERT for Inorganic, practice for Physical |\n\n## A simple preparation plan\n\n1. **Till December** – finish the syllabus and make short notes\n2. **January–February** – board exams + NCERT revision\n3. **March–April** – full-length mock tests every week, analyse every mistake\n4. **Last month** – revision only, no new topics\n\nNeed guidance? Book a free demo class at SNS Institute, Rewari.\n",
